name: Windows build
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build local runtime bundle
        shell: pwsh
        run: ./build.ps1
      - name: Headless model checks
        shell: pwsh
        run: ./test.ps1 -ModelOnly
      - name: Build single-file installer
        shell: pwsh
        run: ./build-installer.ps1
      - name: Test install and uninstall
        shell: pwsh
        run: ./tests/InstallerSmoke.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: FlowDesk-windows-x64
          path: |
            dist/FlowDesk.exe
            dist/FlowDesk.ico
            dist/FlowDesk.DesktopWorker.exe
            dist/native/
      - uses: actions/upload-artifact@v4
        with:
          name: FlowDesk-installer-win-x64
          path: dist/installer/*
